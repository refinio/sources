[package]
name = "sources"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Select development checkouts and pinned release sources through stable workspace paths"
repository = "https://github.com/refinio/sources"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"

[profile.release]
lto = "thin"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"
signal-hook = "0.3"

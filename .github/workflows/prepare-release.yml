# This workflow prepares private Actions artifacts. It never creates a GitHub Release,
# pushes a tag, uploads release assets, publishes packages, or changes repository visibility.
name: Prepare release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archives:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            experimental: false
          - os: macos-15
            target: aarch64-apple-darwin
            experimental: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            experimental: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            experimental: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: python3 .github/scripts/install-dist.py "$RUNNER_TEMP/sources-dist"
      - run: dist plan
      - name: Package executable and record platform manifest
        run: |
          dist build --artifacts=local --target '${{ matrix.target }}' --output-format=json > local-build.json
          cp local-build.json 'target/distrib/${{ matrix.target }}-dist-manifest.json'
      - name: Smoke test packaged executable
        if: runner.os != 'Windows'
        run: python3 .github/scripts/smoke-package.py 'target/distrib/sources-${{ matrix.target }}.tar.gz'
      - name: Smoke test packaged Windows executable
        if: runner.os == 'Windows'
        run: python3 .github/scripts/smoke-package.py 'target/distrib/sources-${{ matrix.target }}.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archives-${{ matrix.target }}
          path: |
            target/distrib/sources-*.tar.gz
            target/distrib/sources-*.zip
            target/distrib/sources-*.sha256
            target/distrib/*-dist-manifest.json
          if-no-files-found: error
          retention-days: 14
  installers:
    needs: archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: python3 .github/scripts/install-dist.py "$RUNNER_TEMP/sources-dist"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archives-*
          path: target/distrib
          merge-multiple: true
      - run: python3 .github/scripts/build-installers.py
      - run: sh -n target/distrib/sources-installer.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sources-release-candidate
          path: target/distrib/*
          if-no-files-found: error
          retention-days: 14
